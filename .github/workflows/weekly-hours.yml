name: Refresh building hours

# Library and dining feeds publish about 7 days ahead, on both campuses, so the
# data goes stale without this — most visibly around finals and breaks, when
# hours change and people most want to know.
on:
  schedule:
    # Sunday AND Monday, 4:20am Illinois time.
    #
    # Sunday is not redundancy, it is a hole being closed. Ohio State's library
    # and rec feeds publish a fixed Sunday-to-Saturday calendar week, so a
    # window fetched on Monday ends the following Saturday and the next Sunday
    # falls outside it — Thompson, 18th Ave, the RPAC and the ARC all read
    # "hours unknown" every Sunday until the Monday run caught up, by which
    # point the day was over. Illinois is unaffected either way: its feeds
    # publish a rolling seven days from the day they are asked.
    #
    # The second run also covers a flaky source: recsports.osu.edu answers in
    # under a second or not at all, and was measured failing three times in
    # five on 2026-10-16.
    - cron: "20 9 * * 0"     # Sundays, 4:20am campus time
    - cron: "20 9 * * 1"     # Mondays, 4:20am campus time
  workflow_dispatch:          # or run it by hand from the Actions tab
    inputs:
      osu_probe:
        description: "Also probe Google for Ohio State (8 searches, prints only)"
        type: boolean
        default: false

permissions:
  contents: write             # to commit the refreshed data file

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild hours — Illinois
        run: python3 scripts/build_hours.py

      # Ohio State's libraries publish a rolling 7-day window, the same shape
      # Illinois' feeds use, so this has exactly the same deadline: miss a week
      # and Thompson and 18th Ave — the two best study spots on that campus —
      # go to "hours unknown". A failure here must not stop Illinois being
      # committed, so it is allowed to fail on its own.
      - name: Rebuild hours — Ohio State
        continue-on-error: true
        run: python3 scripts/build_osu_hours.py

      # Maryland's libraries publish dated hours eight weeks ahead, so this has
      # a far looser deadline than the other two — but Stamp and RecWell are
      # scraped HTML, and markup changes without warning, so running it weekly
      # is how a break gets noticed while it is still small. Allowed to fail on
      # its own so it cannot take Illinois or Ohio State down with it.
      - name: Rebuild hours — Maryland
        continue-on-error: true
        run: python3 scripts/build_umd_hours.py

      # U of T's library pages carry 84 days of dated hours, a rolling window, so this
      # belongs in the weekly run. Its own step so it cannot take another campus down.
      - name: Rebuild hours — U of T St. George
        continue-on-error: true
        run: python3 scripts/build_utsg_hours.py

      # Refresh Google listing hours too, if a SERPAPI_KEY secret has been added.
      # (Checked in the shell: GitHub doesn't allow secrets in an `if:`.)
      #
      # Mondays only, unlike the feeds above. The Sunday run exists to close the
      # Ohio State calendar-week hole, which is a problem about DATED feeds;
      # Google publishes a weekly pattern that does not move Sunday to Sunday.
      # Running it twice would just double the SerpApi spend -- 13 buildings on
      # the free plan's 250 searches a month is ~57 monthly at one run a week,
      # ~113 at two -- and leave no headroom for a second campus or a retry.
      # Manual runs from the Actions tab still include it.
      - name: Refresh Google hours
        if: github.event.schedule != '20 9 * * 0'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -n "$SERPAPI_KEY" ]; then
            python3 scripts/fetch_google_hours.py
            python3 scripts/build_hours.py
          else
            echo "No SERPAPI_KEY secret set; skipping Google hours."
          fi

      # Ohio State is a probe, not a source: this prints what Google holds and
      # writes nothing that anything reads. Run it from the Actions tab with the
      # box ticked, then score the two control buildings -- Ag. Admin. and
      # Pomerene -- against the hours the registrar already publishes.
      - name: Probe Google hours - Ohio State
        if: inputs.osu_probe
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -n "$SERPAPI_KEY" ]; then
            python3 scripts/fetch_google_hours.py --campus osu
            echo "--- what Google returned ---"
            cat data/osu/google_hours.json
          else
            echo "No SERPAPI_KEY secret set; skipping the Ohio State probe."
          fi

      - name: Commit if anything changed
        run: |
          git config user.name "hours bot"
          git config user.email "actions@github.com"
          git add data/building_hours.json data/google_hours.json data/osu/building_hours.json data/umd/building_hours.json data/utsg/building_hours.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Hours unchanged."
          else
            git commit -m "Refresh building hours"
            git push
          fi
